name: Release

# Push a tag like v1.0.0 to build signed APKs and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testGithubReleaseUnitTest :app:testPlayReleaseUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BURROW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing BURROW_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BURROW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          BURROW_KEYSTORE_PASSWORD: ${{ secrets.BURROW_KEYSTORE_PASSWORD }}
          BURROW_KEY_ALIAS: ${{ secrets.BURROW_KEY_ALIAS }}
          BURROW_KEY_PASSWORD: ${{ secrets.BURROW_KEY_PASSWORD }}
        # github = the APK for GitHub Releases (with the update check; the only build with INTERNET). F-Droid builds foss itself.
        run: ./gradlew :app:assembleGithubRelease :app:assembleFossRelease

      - name: Rename and verify
        run: |
          mkdir dist
          # burrow-0.2.0-github.apk: the in-app updater looks for "-github.apk" and SHA256SUMS.txt.
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/burrow-${VERSION}-github.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "dist/burrow-${VERSION}-foss.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do "$APKSIGNER" verify --print-certs "$apk" | head -3; done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # The notes are this version's CHANGELOG.md section; the app shows its "- " lines as What's new.
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Burrow $GITHUB_REF_NAME" --notes-file notes.md
